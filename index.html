<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503</title>

<style>

/* BASE */

body{
    margin:0;
    padding:15px;
    background:#ffffff;
    color:#000;
    font-family:"Times New Roman", serif;
    overflow-x:hidden;
}

h1{
    margin:0;
    font-size:24px;
}

/* DEBUG PANEL */

#debug-menu{
    position:fixed;
    top:0;
    left:-380px;
    width:360px;
    height:100%;
    background:#3c3c3c;
    color:#e6e6e6;
    font-family:Consolas, monospace;
    border-right:1px solid #4a4a4a;
    transition:0.25s;
    z-index:99999;
    overflow-y:auto;
    box-shadow:0 0 25px rgba(0,0,0,0.45);
}

#debug-menu.active{
    left:0;
}

/* TOPBAR */

.chrome-topbar{
    height:32px;
    background:#323232;
    border-bottom:1px solid #4a4a4a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 10px;
}

.topbar-title{
    font-size:12px;
    color:#dcdcdc;
}

.win-buttons{
    display:flex;
}

.win-btn{
    width:40px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#dcdcdc;
    transition:0.15s;
}

.win-btn:hover{
    background:#555;
}

.win-btn.close:hover{
    background:#e81123;
    color:#fff;
}

/* SECTIONS */

.section{
    background:#343434;
    border:1px solid #4a4a4a;
    margin:10px;
}

.section-title{
    background:#2f2f2f;
    padding:6px 10px;
    font-size:11px;
    color:#bfbfbf;
    border-bottom:1px solid #4a4a4a;
    text-transform:uppercase;
}

.section-body{
    padding:10px;
    font-size:12px;
}

/* STATUS */

.status{
    color:#ffcc66;
}

.good{
    color:#66ff99;
}

/* COUNTER */

.counter{
    font-size:22px;
    text-align:center;
    color:#8ab4f8;
}

/* LOG */

.log{
    font-size:11px;
    color:#cfcfcf;
    line-height:1.4;
    max-height:120px;
    overflow:hidden;
}

.blink{
    animation:blink 1s infinite;
}

@keyframes blink{
    50%{opacity:0.4;}
}

</style>
</head>

<body>

<h1>Created by Whilkle. (Username in discord: shaylushay2)/h1>

<div id="debug-menu">

    <div class="chrome-topbar">

        <div class="topbar-title">
            Debug Tool [BETA]
        </div>

        <div class="win-buttons">

            <div class="win-btn close"
            onclick="document.getElementById('debug-menu').classList.remove('active')">
                ✕
            </div>

        </div>

    </div>

    <div class="section">

        <div class="section-title">Global Traffic Monitor</div>

        <div class="section-body counter" id="visits">
            000000
        </div>

    </div>

    <div class="section">

        <div class="section-title">Steam API Connection</div>

        <div class="section-body">

            <div class="status blink" id="conn-status">
                CONNECTING...
            </div>

            <div class="log" id="log"></div>

        </div>

    </div>

    <div class="section">

        <div class="section-title">Last Node Access</div>

        <div class="section-body" id="time"></div>

    </div>

</div>

<script>

/* TIME */

document.getElementById("time").innerText =
    new Date().toLocaleTimeString();

/* VISITS */

let v = localStorage.getItem("v") || 0;
v++;
localStorage.setItem("v", v);

document.getElementById("visits").innerText =
    String(v).padStart(6,"0");

/* FAKE STEAM CONNECTION LOG */

const log = document.getElementById("log");
const status = document.getElementById("conn-status");

let steps = [
    "Resolving steam servers...",
    "Connecting to relay node EU-CENTRAL-04...",
    "Handshake protocol v3.2...",
    "Requesting session token...",
    "Encrypting payload...",
    "Retrying connection...",
    "Connection unstable..."
];

let i = 0;

function addLog(){
    if(i < steps.length){
        log.innerHTML += ">" + steps[i] + "<br>";
        i++;
        setTimeout(addLog, 900);
    } else {
        status.innerHTML = "UNAVAILABLE";
        status.classList.add("status");
    }
}

addLog();

/* MENU KEY */

let keys = [];

window.addEventListener("keydown",(e)=>{

    keys.push(e.key);
    if(keys.length > 3) keys.shift();

    if(keys.join("") === "F8F9F8"){
        document.getElementById("debug-menu").classList.toggle("active");
        keys = [];
    }

});

</script>

</body>
</html>
